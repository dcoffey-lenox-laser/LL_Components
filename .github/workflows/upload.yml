name: Upload component
on:
  push:
    branches: [ main ]

jobs:
  upload_components:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/upload-components-ci-action@v2
        with:
          components: |
            components/stepper_driver
            components/quadrature_encoder
          namespace: "dcoffey-lenox-laser"
          api_token: ${{secrets.IDF_COMPONENT_API_TOKEN}}
